{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <a href="{% url 'messaging:messaging_home' %}" class="btn btn-sm btn-link">&larr; Back</a>
            <strong>
                {% if other %}
                {{ other_display }}
                {% else %}
                Conversation
                {% endif %}
            </strong>
        </div>
        <div class="card-body messages-scroll" id="messages-container"></div>
        <div class="card-footer">
            <form method="post" id="message-form">
                {% csrf_token %}
                {{ form.body }}
                <div class="mt-2 text-end">
                    <button type="button" class="btn btn-primary" id="send-btn">Send</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const conversationId = {{ conversation.pk }};
    const messagesContainer = document.getElementById('messages-container');
    const currentUsername = '{{ user.username }}';

    function renderMessages(messagesData) {
        messagesData.forEach(msg => {
            const isCurrentUser = msg.sender === currentUsername;
            const alignment = isCurrentUser ? 'justify-content-end' : 'justify-content-start';

            const msgDiv = document.createElement('div');
            msgDiv.className = `mb-3 d-flex ${alignment}`;

            const inner = document.createElement('div');
            inner.className = `message-bubble ${isCurrentUser ? 'me' : 'them'}`;
            inner.innerHTML = `
                <div class="small fw-bold">${msg.sender_display || msg.sender}</div>
                <div>${msg.body.replace(/\n/g, '<br>')}</div>
                <div class="small text-muted mt-1">${new Date(msg.created_at).toLocaleString()}</div>
            `;

            msgDiv.appendChild(inner);
            messagesContainer.appendChild(msgDiv);
        });
    }

    // ld msgs
    window.addEventListener('load', function () {
        fetch(`{% url 'messaging:conversation_detail' conversation.pk %}?format=json`)
            .then(response => response.json())
            .then(data => {
                renderMessages(data.messages);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
    });

    // 3 sec polling. change time at bottom of of this its in ms.
    setInterval(function () {
        fetch(`{% url 'messaging:conversation_detail' conversation.pk %}?format=json`)
            .then(response => response.json())
            .then(data => {
                const currentMessageCount = document.querySelectorAll('.mb-3.d-flex').length;
                if (data.messages.length > currentMessageCount) {
                    const newMessages = data.messages.slice(currentMessageCount);
                    renderMessages(newMessages);
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            })
            .catch(error => console.log('Auto-refresh check failed:', error));
    }, 3000); // rEFRECSH INETERVAL SET HERE

    document.getElementById('send-btn').addEventListener('click', function (e) {
        e.preventDefault();
        const form = document.getElementById('message-form');
        const formData = new FormData(form);

        fetch(form.action || window.location.href, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
            .then(response => {
                if (response.ok) {
                    document.querySelector('textarea').value = '';
                    fetch(`{% url 'messaging:conversation_detail' conversation.pk %}?format=json`)
                        .then(r => r.json())
                        .then(data => {
                            const currentMessageCount = document.querySelectorAll('.mb-3.d-flex').length;
                            const newMessages = data.messages.slice(currentMessageCount);
                            renderMessages(newMessages);
                            messagesContainer.scrollTop = messagesContainer.scrollHeight;
                        });
                }
            })
            .catch(error => console.log('Send failed:', error));
    });
</script>
{% endblock content %}
